<!DOCTYPE html>
<html>
<head>
    <title>SecureShare - OTP Verification</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .box {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            width: 430px;
            border-radius: 18px;
            box-shadow: 0px 0px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, #2563eb, #38bdf8);
            transition: 0.2s ease-in-out;
        }

        button:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .msg {
            margin-top: 15px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="badge">📩 OTP Authentication</div>

        <h2>OTP Verification</h2>
        <p class="subtitle">Enter your registered email to receive OTP</p>

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter Email Address" required>
            <button type="submit">📨 Send OTP</button>
        </form>

        {% if message %}
            <p class="msg">{{ message }}</p>
        {% endif %}

        <div class="footer">
            © 2026 SecureShare | Secure OTP Verification
        </div>

    </div>
</body>
</html>
