<!DOCTYPE html>
<html>
<head>
    <title>SecureShare - Download</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .box {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            width: 460px;
            border-radius: 18px;
            box-shadow: 0px 0px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        .error-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #ff4d4d;
            font-weight: bold;
        }

        .timer {
            margin-top: 18px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.25);
            font-size: 14px;
            font-weight: bold;
            color: #facc15;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, #ff512f, #dd2476);
            transition: 0.2s ease-in-out;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="box">

        <h2>Secure File Download</h2>

        {% if error_message %}
            <div class="error-box">
                {{ error_message }}
            </div>
        {% else %}

            <p><b>File Name:</b> {{ filename }}</p>

            {% if not disable_timer %}
            <div class="timer">
                ⏳ Link expires in: <span id="countdown"></span>
            </div>
            {% endif %}

            <form method="POST">
    {% csrf_token %}
    <button type="submit">⬇ Download File</button>
</form>
            </form>

        {% endif %}

    </div>
<div style="
position:fixed;
bottom:15px;
right:20px;
opacity:0.15;
font-size:18px;
font-weight:bold;
color:white;">
{{ request.session.verified_token }}
</div>
<script>
    let disableTimer = "{{ disable_timer }}" === "True";
    let seconds = parseInt("{{ remaining_seconds|default:0 }}");

    if (!disableTimer) {
        function updateTimer() {
            if (seconds <= 0) {
                document.getElementById("countdown").innerHTML = "Expired";
                return;
            }

            let min = Math.floor(seconds / 60);
            let sec = seconds % 60;

            document.getElementById("countdown").innerHTML =
                min + " min " + sec + " sec";

            seconds--;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    }
    // Disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// Blur when tab inactive
document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
        document.body.style.filter = "blur(20px)";
    } else {
        document.body.style.filter = "none";
    }
});

// DevTools detection
setInterval(function() {
    if (window.outerHeight - window.innerHeight > 150) {
        document.body.innerHTML = "<h1>🚫 DevTools Detected. Access Blocked.</h1>";
    }
}, 1000);
</script>
<script>

document.addEventListener("DOMContentLoaded", function () {

    /* -----------------------------
       1. Disable Right Click
    ----------------------------- */
    document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
    });

    /* -----------------------------
       2. Disable Keyboard Shortcuts
    ----------------------------- */
    document.addEventListener("keydown", function (e) {

        // F12
        if (e.key === "F12") {
            e.preventDefault();
        }

        // Ctrl+Shift+I
        if (e.ctrlKey && e.shiftKey && e.key === "I") {
            e.preventDefault();
        }

        // Ctrl+Shift+J
        if (e.ctrlKey && e.shiftKey && e.key === "J") {
            e.preventDefault();
        }

        // Ctrl+U (view source)
        if (e.ctrlKey && e.key === "u") {
            e.preventDefault();
        }
    });

    /* -----------------------------
       3. Blur When Tab Inactive
    ----------------------------- */
    document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
            document.body.style.filter = "blur(30px)";
        } else {
            document.body.style.filter = "none";
        }
    });

    /* -----------------------------
       4. Strong DevTools Detection
    ----------------------------- */
    setInterval(function () {

        const widthThreshold = window.outerWidth - window.innerWidth > 120;
        const heightThreshold = window.outerHeight - window.innerHeight > 120;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    background:#111;
                    color:red;
                    font-size:28px;
                    font-weight:bold;">
                    🚫 Developer Tools Detected. Access Blocked.
                </div>
            `;
        }

    }, 500);

});
</script>
<script>
document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
        document.body.style.opacity = "0.1";
        document.body.style.transition = "0.3s";
    } else {
        document.body.style.opacity = "1";
    }
});
</script>

</body>
</html>
