{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>SecureShare - Login</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .box {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            width: 420px;
            border-radius: 18px;
            box-shadow: 0px 0px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, #2563eb, #38bdf8);
            transition: 0.2s ease-in-out;
        }

        button:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .msg {
            margin-top: 15px;
            font-weight: bold;
            color: #ff6b6b;
        }

        a {
            color: #38bdf8;
            font-weight: bold;
            text-decoration: none;
        }
        img {
    transition: 0.2s ease-in-out;
}
img:hover {
    transform: translateY(-50%) scale(1.1);
}
.input-group {
    position: relative;
    margin-top: 18px;
}

.input-group input {
    width: 90%;
    padding: 12px 45px 12px 14px;  /* extra right padding for icon */
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
}

.eye-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    cursor: pointer;
    opacity: 0.8;
    transition: 0.2s ease-in-out;
}

.eye-icon:hover {
    opacity: 1;
    transform: translateY(-50%) scale(1.1);
}

        a:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="badge">🔐 SecureShare Login</div>

        <h2>Sender Login</h2>
        <p class="subtitle">Login to upload and generate secure file links</p>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Enter Username" required>
           <div class="input-group">
    <input type="password" id="password" name="password" placeholder="Enter Password" required>

    <img id="toggleIcon"
         src="{% static 'images/hide.png' %}"
         onclick="togglePassword()"
         class="eye-icon">
</div>

            <button type="submit">➡ Login</button>
        </form>

        {% if message %}
            <p class="msg">{{ message }}</p>
        {% endif %}

        <p style="margin-top:18px; font-size:14px; color:#cbd5e1;">
            New user? <a href="/signup/">Create Account</a>
        </p>

        <div class="footer">
            © 2026 SecureShare | Secure Login System
        </div>

    </div>
   <script>
function togglePassword() {
    let input = document.getElementById("password");
    let icon = document.getElementById("toggleIcon");

    if (input.type === "password") {
        input.type = "text";
        icon.src = "{% static 'images/view.png' %}";
    } else {
        input.type = "password";
        icon.src = "{% static 'images/hide.png' %}";
    }
}
</script>
</body>
</html>
